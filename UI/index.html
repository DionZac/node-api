<!DOCTYPE html>
<html lang="en">

<head>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture & Upload</title>
    <link rel="stylesheet" href="./main.css" />
    <!-- ① Add Font Awesome (for the tick icon that appears at the end) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        integrity="sha512-dIw+CJX3x5JYqHB1x9rhX…(truncated)…" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>



    <!-- ② FULLSCREEN LOADER ----------------------------------------->
    <div id="loader">
        <div id="wrapper">
            <div id="mouse"></div>
            <div class="spinner"></div>

            <div class="loading-bar">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="status">
                <div class="state" id="state">Loading</div>
                <div class="percentage" id="percent">0%</div>
            </div>

            <div class="response-text"></div>
        </div>
    </div>

    <img src="./background-3.PNG" style="object-fit:contain; width: 100%" />

    <!-- Capture Screen -->
    <div id="captureContainer" style="position: fixed;bottom: 2%; right: 2%;">
        
        <!-- <video src="test.mp4" style="z-index:-1" muted loop></video> -->
        <button id="captureBtn" style="z-index: 2;">
            <svg style="    width: 60%; height: 60%;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512"><path style="fill:white;" d="M256 109.3L256 320c0 17.7-14.3 32-32 32s-32-14.3-32-32l0-210.7-41.4 41.4c-12.5 12.5-32.8 12.5-45.3 0s-12.5-32.8 0-45.3l96-96c12.5-12.5 32.8-12.5 45.3 0l96 96c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L256 109.3zM224 400c44.2 0 80-35.8 80-80l80 0c35.3 0 64 28.7 64 64l0 32c0 35.3-28.7 64-64 64L64 480c-35.3 0-64-28.7-64-64l0-32c0-35.3 28.7-64 64-64l80 0c0 44.2 35.8 80 80 80zm144 24a24 24 0 1 0 0-48 24 24 0 1 0 0 48z"/></svg>
        </button>
        <input type="file" id="fileInput" accept="image/*,video/*"  style="display: none;"
            multiple>
    </div>


    <script>
        const SERVER_URL = "http://192.168.2.6:9000";
        const IMAGE_UPLOAD_ENDPOINT = "/image_upload";
        const VIDEO_UPLOAD_ENDPOINT = "/video_upload";

        const RESPONSE_TEXT_ERROR = "Could not upload your media :(";
        const RESPONSE_TEXT_SUCCESS = "Your media has been uploaded! Thanks :)"


        const captureBtn = document.getElementById("captureBtn");
        const fileInput = document.getElementById("fileInput");
        const captureContainer = document.getElementById("captureContainer");
        const uploadBtn = document.getElementById("uploadBtn");

        const loader = document.getElementById('loader');
        const progressBar = document.getElementById('progressBar');
        const percentTxt = document.getElementById('percent');
        const stateTxt = document.getElementById('state');
        const spinner = document.querySelector('.spinner');  // grab once
        const responseText = document.querySelector('.response-text');


        captureBtn.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", async (event) => {
            loader.style.display = 'flex';           // show overlay
            progressBar.style.width = '0%';
            percentTxt.textContent = '0%';
            stateTxt.textContent = 'Uploading';

            let images = [];
            let videos = [];

            const files = event.target.files;
            if (!files) return;

            for (let file of files) {

                // captureContainer.style.display = "none";

                const fileURL = URL.createObjectURL(file);
                if (file.type.startsWith("image")) {
                    
                    images.push(file);
                } else if (file.type.startsWith("video")) {
                    videos.push(file);
                    
                }
            }

            try {
                await uploadImages(images);
            }
            catch (e) {}

            try {
                await uploadVideos(videos);
            }
            catch (e) {}


        });

        sendRequest = (url, formData) => {
            document.querySelector('.loading-bar').classList.remove('hidden');
            document.querySelector('.status').classList.remove('hidden');
            spinner.classList.remove('error');
            spinner.classList.remove('success');

            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();

                xhr.upload.onprogress = function (e) {

                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = pct + '%';
                        percentTxt.textContent = pct + '%';
                    }
                };

                xhr.onload = function () {
                    spinner.classList.remove('error'); // in case of retry
                    spinner.classList.add('success');  // ✓
                    
                    responseText.textContent = RESPONSE_TEXT_SUCCESS;
                    document.querySelector('.loading-bar').classList.add('hidden');
                    document.querySelector('.status').classList.add('hidden');

                    loader.click(() => {
                        window.location.reload();
                    });

                    window.reload_timeout = setTimeout(() => {
                        window.location.reload();
                    }, 3000);
                    
                    resolve();
                };

                xhr.onerror = function () {
                    spinner.classList.remove('success');
                    spinner.classList.add('error');    // ✕

                    responseText.textContent = RESPONSE_TEXT_ERROR;
                    document.querySelector('.loading-bar').classList.add('hidden');
                    document.querySelector('.status').classList.add('hidden');

                    loader.click(() => {
                        window.location.reload();
                    });

                    window.reload_timeout = setTimeout(() => {
                        window.location.reload();
                    }, 3000);

                    reject();
                };

                xhr.open('POST', url);
                xhr.send(formData);
            })
        }

        uploadImages = async (files) => {
            if (!files || files.length < 1) return;

            const formData = new FormData();
            for (let file of files) {
                formData.append("images", file);
            }
            await sendRequest(IMAGE_UPLOAD_ENDPOINT, formData);

        }

        uploadVideos = async (files) => {
            if (!files || files.length < 1) return;

            const formData = new FormData();
            for (let file of files) {
                formData.append("videos", file);
            }
            await sendRequest(VIDEO_UPLOAD_ENDPOINT, formData);
        }

        $('video').css({
            width: $(window).width(),
            height: $(window).height()
        })
    </script>

</body>

</html>
