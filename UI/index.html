<!DOCTYPE html>
<html lang="en">

<head>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capture & Upload</title>
    <link rel="stylesheet" href="./main.css" />
    <!-- ① Add Font Awesome (for the tick icon that appears at the end) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
        integrity="sha512-dIw+CJX3x5JYqHB1x9rhX…(truncated)…" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>



    <!-- ② FULLSCREEN LOADER ----------------------------------------->
    <div id="loader">
        <div id="wrapper">
            <div id="mouse"></div>
            <div class="spinner"></div>

            <div class="loading-bar">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="status">
                <div class="state" id="state">Loading</div>
                <div class="percentage" id="percent">0%</div>
            </div>

            <div class="response-text"></div>
        </div>
    </div>

    <!-- Capture Screen -->
    <div id="captureContainer" style="position: absolute;top: 80%;">
        <!-- <img src="./background.PNG" style="object-fit:contain" /> -->
        <!-- <video src="test.mp4" style="z-index:-1" muted loop></video> -->
        <button id="captureBtn" style="z-index: 2;">Upload photos and videos</button>
        <input type="file" id="fileInput" accept="image/*,video/*"  style="display: none;"
            multiple>
    </div>


    <script>
        const SERVER_URL = "http://192.168.2.6:9000";
        const IMAGE_UPLOAD_ENDPOINT = "/image_upload";
        const VIDEO_UPLOAD_ENDPOINT = "/video_upload";

        const RESPONSE_TEXT_ERROR = "Could not upload your media :(";
        const RESPONSE_TEXT_SUCCESS = "Your media has been uploaded! Thanks :)"


        const captureBtn = document.getElementById("captureBtn");
        const fileInput = document.getElementById("fileInput");
        const captureContainer = document.getElementById("captureContainer");
        const uploadBtn = document.getElementById("uploadBtn");

        const loader = document.getElementById('loader');
        const progressBar = document.getElementById('progressBar');
        const percentTxt = document.getElementById('percent');
        const stateTxt = document.getElementById('state');
        const spinner = document.querySelector('.spinner');  // grab once
        const responseText = document.querySelector('.response-text');


        captureBtn.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", async (event) => {
            loader.style.display = 'flex';           // show overlay
            progressBar.style.width = '0%';
            percentTxt.textContent = '0%';
            stateTxt.textContent = 'Loading';

            debugger;
            let images = [];
            let videos = [];

            const files = event.target.files;
            if (!files) return;

            for (let file of files) {

                // captureContainer.style.display = "none";

                const fileURL = URL.createObjectURL(file);
                if (file.type.startsWith("image")) {
                    
                    images.push(file);
                } else if (file.type.startsWith("video")) {
                    videos.push(file);
                    
                }
            }

            try {
                await uploadImages(images);
            }
            catch (e) {
                // Handle image upload fail
                debugger;
            }

            try {
                await uploadVideos(videos);
            }
            catch (e) {
                // Handle video upload fail
                debugger;
            }


        });

        sendRequest = (url, formData) => {
            document.querySelector('.loading-bar').classList.remove('hidden');
            document.querySelector('.status').classList.remove('hidden');
            spinner.classList.remove('error');
            spinner.classList.remove('success');

            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();

                xhr.upload.onprogress = function (e) {

                    if (e.lengthComputable) {
                        const pct = Math.round((e.loaded / e.total) * 100);
                        progressBar.style.width = pct + '%';
                        percentTxt.textContent = pct + '%';
                    }
                };

                xhr.onload = function () {
                    spinner.classList.remove('error'); // in case of retry
                    spinner.classList.add('success');  // ✓
                    
                    responseText.textContent = RESPONSE_TEXT_SUCCESS;
                    document.querySelector('.loading-bar').classList.add('hidden');
                    document.querySelector('.status').classList.add('hidden');

                    loader.click(() => {
                        loader.style.display = 'none';
                    })
                    resolve();
                };

                xhr.onerror = function () {
                    spinner.classList.remove('success');
                    spinner.classList.add('error');    // ✕

                    responseText.textContent = RESPONSE_TEXT_ERROR;
                    document.querySelector('.loading-bar').classList.add('hidden');
                    document.querySelector('.status').classList.add('hidden');

                    loader.click(() => {
                        
                        loader.style.display = 'none';
                    })
                    reject();
                };

                xhr.open('POST', url);
                xhr.send(formData);
            })
        }

        uploadImages = async (files) => {
            if (!files || files.length < 1) return;

            const formData = new FormData();
            for (let file of files) {
                formData.append("images", file);
            }
            await sendRequest(IMAGE_UPLOAD_ENDPOINT, formData);

        }

        uploadVideos = async (files) => {
            if (!files || files.length < 1) return;

            const formData = new FormData();
            for (let file of files) {
                formData.append("videos", file);
            }
            await sendRequest(VIDEO_UPLOAD_ENDPOINT, formData);
        }

        $('video').css({
            width: $(window).width(),
            height: $(window).height()
        })
        document.querySelector('video').play();
    </script>

</body>

</html>
